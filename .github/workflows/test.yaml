name: test

on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: esp8266_NTP-Clock

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install libraries
        run: arduino-cli lib install "NTPClient" "Adafruit GFX Library" "Adafruit SSD1306"

      - name: Create wifiData.h from example
        run: cp esp8266_NTP-Clock/wifiData.h-example esp8266_NTP-Clock/wifiData.h

      - name: Compile sketch
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./esp8266_NTP-Clock
